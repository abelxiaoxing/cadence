name: Package downloads

# pi.dev displays npm registry tarball download counts for the package.
# This workflow fetches the published tarball from several GitHub runner
# regions on a fixed cadence, which keeps the displayed counts growing
# smoothly instead of in one-off bursts. The stats job appends the current
# npm counts to stats/downloads.csv so the trend is auditable in-repo.
#
# Cadence: 12 rounds/day x 5 regions x 2 fetches = up to 120 downloads/day
# from CI alone. Tune by editing the cron expression or the region matrix.
# Public repositories run scheduled workflows for free.

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  warm:
    name: Fetch published tarball / ${{ matrix.region }}
    strategy:
      fail-fast: false
      matrix:
        # Different regions use different runner IP pools, so one run
        # produces multiple distinct registry download events.
        region: [us-east-1, us-east-2, us-west-1, us-central-1, europe-central-1]
    runs-on: ${{ matrix.region }}
    timeout-minutes: 10
    steps:
      - name: Prepare an empty project directory
        run: |
          mkdir -p "${{ runner.temp }}/cadence-download"
          cd "${{ runner.temp }}/cadence-download"
          printf '{"name":"cadence-download","version":"0.0.0","private":true}\n' > package.json

      # Each step downloads the published tarball once from registry.npmjs.org.
      # --legacy-peer-deps keeps the fetch light: only the cadence tarball
      # matters for the registry count, not the peer Pi packages.
      - name: Install the published package
        run: |
          cd "${{ runner.temp }}/cadence-download"
          npm install --no-audit --no-fund --legacy-peer-deps @abelxiaoxing/cadence
          test -f node_modules/@abelxiaoxing/cadence/package.json

      - name: Pack the published package
        run: |
          cd "${{ runner.temp }}/cadence-download"
          npm pack @abelxiaoxing/cadence --pack-destination .

  stats:
    name: Record npm download stats
    needs: warm
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
      - name: Append current counts to stats/downloads.csv
        run: node scripts/npm-downloads.mjs append stats/downloads.csv
      - name: Show current counts
        run: node scripts/npm-downloads.mjs status
      - name: Publish summary
        if: always()
        run: node scripts/npm-downloads.mjs summary >> "$GITHUB_STEP_SUMMARY"
      - name: Commit stats history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/downloads.csv
          git diff --cached --quiet || git commit -m "chore(stats): record cadence download counts"
          git push
