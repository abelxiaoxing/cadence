name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-platform:
    name: Lightweight workflow / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Use the runner's available Node; record actual capabilities and identity.
      # Dependency metadata remains separate from release qualification.
      - name: Fresh owned canonical native temporary directory
        run: node scripts/ci-temp.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Record actual Node and Pi identities
        run: node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.stringify({node:process.version,executable:process.execPath,pi:JSON.parse(fs.readFileSync('node_modules/@earendil-works/pi-coding-agent/package.json','utf8')).version,platform:process.platform,arch:process.arch}))"
      - run: bun run check
      - run: bun run lint
      # Serial new controller/storage/process/SDK tests and exact archive/body/pins.
      # Real source/extracted regular/fullscreen PTYs execute on POSIX only.
      # Windows direct-child cancellation is weaker; this is not ConPTY evidence.
      - run: bun run test
      - run: bun run check:agents
      - run: bun run pack:check
      - run: bun run traceability:check --map .trellis/tasks/10-06-cadence-retirement-distribution-qualification/research/acceptance-map-ci.json
      - name: Preserve new diagnostic fixtures without overriding failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ env.TMPDIR }}/cadence-terminal-*/pty-receipt.json
            ${{ env.TMPDIR }}/cadence-terminal-*/terminal.bin
            ${{ env.TMPDIR }}/cadence-terminal-*/identity.json
            ${{ env.TMPDIR }}/cadence-distribution-*/distribution-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
