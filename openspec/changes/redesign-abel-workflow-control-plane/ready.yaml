receipt_version: 1
change: redesign-abel-workflow-control-plane
schema: spec-driven
approval:
  summary: >-
    用户明确批准按已呈现的 breaking v2 技术契约与七任务 Implement graph
    物化，并要求修复本轮 review 的 identity、rebind、state-root、apply recovery、
    bootstrap cutover、遗留 activity test 与 canonical scheduling 问题。批准覆盖
    WorkflowEngine 单一迁移权威、Node >=22.13.0 内置 SQLite
    event journal 与 transactional projections、可续租 operation lease、
    DeliveryCompiler、精确路径 manifest、内容寻址 ArtifactStore、
    immutable WorkspaceStore、Bubblewrap IsolationBackend、TaskLedger、
    128 KiB/8 MiB sealed candidate、JSON route broker、可恢复 CAS apply、
    真实语义 activity projection，以及
    T1 -> {T2,T3} -> T4 -> T5 -> T6 -> T7 的七任务 DAG。
    T4 对 T2 具有显式 conflict-order barrier，T2/T3 使用互异 verification
    lock 且是唯一并行波次；全部 phase exact read/write、verification input、
    output provenance、affected suite、资源锁与 T7 parent-only AGENTS
    checkpoint 均绑定在下方 canonical graph 和 tasks.md。批准不授予工具权限，
    不允许运行期扩大行为、架构、路径、依赖、验证或 AGENTS 边界。
  verbatim: |-
    批准 Gate B，按该技术契约和 7-task graph 物化，并且有序所有的我都默认批准
    修复上述review产生的问题，注意当前项目处于开发阶段，无需考虑兼容性
technical_contract:
  bootstrap:
    receipt: current-v1
    purpose: this change is delivered once through the runtime it replaces
    activation: v1 remains selected through every bootstrap task and approved acceptance check
    handoff: a resumable v2 BootstrapHandoff is durably committed before the selector compare-and-swap
    installed_behavior: v2 rejects v1 receipts and exposes no compatibility adapter
  architecture:
    - WorkflowEngine is the sole run/task transition authority.
    - RunStore uses stable revision-independent run identities with versioned delivery bindings and node:sqlite WAL, synchronous FULL, transactional event/projection commits, idempotency keys, renewable fenced leases, and one exact bootstrap-handoff record in an owner-private XDG state root that rejects any resolved state path equal to or below the canonical consumer root.
    - DeliveryCompiler compiles one canonical ImplementPlanV2; tasks.md is its human projection in the future v2 protocol.
    - ArtifactStore and WorkspaceStore hold content-addressed blobs and immutable MVCC manifests; no Git worktree or unisolated verification fallback is allowed.
    - WorkerBroker uses project-or-user whole-file JSON route policy with explicit inherited/custom routes, closed role capability checks, bounded attempts, cooldown, and explicit rebind.
    - TaskLedger persists bounded evidence while every child session remains disposable and replaceable.
    - ApplyTransaction journals intent before per-file CAS mutation, routes cancel/discard after the first mutation through recovery while retaining rollback material, and recovers by safe roll-forward or rollback without overwriting external edits.
    - ActivityProjection derives every view from durable semantic state; only completed renders a success checkmark.
  task_dag:
    - "T1-control-store-delivery -> T2-route-policy-broker [contract]"
    - "T1-control-store-delivery -> T3-workspace-revisions [contract]"
    - "T1-control-store-delivery + T2-route-policy-broker + T3-workspace-revisions -> T4-transactional-apply [contract, conflict-order, artifact]"
    - "T1-control-store-delivery + T2-route-policy-broker + T3-workspace-revisions + T4-transactional-apply -> T5-worker-artifacts-ledger [contract, artifact]"
    - "T1-control-store-delivery + T2-route-policy-broker + T3-workspace-revisions + T4-transactional-apply + T5-worker-artifacts-ledger -> T6-workflow-engine [contract]"
    - "T6-workflow-engine -> T7-workflow-ux-distribution [contract]"
  suggested_waves:
    - [T1-control-store-delivery]
    - [T2-route-policy-broker, T3-workspace-revisions]
    - [T4-transactional-apply]
    - [T5-worker-artifacts-ledger]
    - [T6-workflow-engine]
    - [T7-workflow-ux-distribution]
  preconditions:
    - Validate both receipts, every normalized artifact hash, strict OpenSpec validation, graph hash/closure, Bun/Vitest capability, and the current safe workspace snapshot before registering work.
    - Record target, affected-suite, and full-suite baselines with exit codes and normalized identities before each task; pre-existing failures never witness Red.
    - Require every direct predecessor completed and every published output present as a safe regular file before a consumer becomes ready.
    - Keep the main workspace unchanged until cumulative change verification and final currentness succeed.
  scheduling:
    conflicts:
      T4-transactional-apply: [T2-route-policy-broker]
    explanation: exact dependency edges serialize every overlapping task; T4 explicitly waits for T2 and T3, while T2 and T3 have disjoint writes, resources, and verification locks
    verification_locks:
      default: vitest-cadence-v2
      T2-route-policy-broker: vitest-cadence-v2-route-policy
      T3-workspace-revisions: vitest-cadence-v2-workspace-revisions
    resources:
      T1-control-store-delivery: [control-store-schema, delivery-v2]
      T2-route-policy-broker: [route-policy, provider-runtime]
      T3-workspace-revisions: [artifact-store, workspace-revisions]
      T4-transactional-apply: [workspace-revisions, apply-transaction, verification-sandbox]
      T5-worker-artifacts-ledger: [artifact-store, task-ledger, child-session]
      T6-workflow-engine: [workflow-engine, scheduler, private-tool]
      T7-workflow-ux-distribution: [workflow-contracts, package-distribution, activity-ui]
  verification:
    runner: { kind: package-script, packageManager: bun, script: "test:target", command: "vitest run" }
    red_identity_prefix: "[CADENCE-V2:"
    task_types:
      T1-control-store-delivery: property
      T2-route-policy-broker: example
      T3-workspace-revisions: property
      T4-transactional-apply: example
      T5-worker-artifacts-ledger: example
      T6-workflow-engine: example
      T7-workflow-ux-distribution: example
    approved_dependencies: []
  agents:
    default: { impact: none, managedOnly: true }
    T7-workflow-ux-distribution: { impact: update-existing, target: AGENTS.md, managedOnly: true }
    checkpoint_verification: bun run check:agents
