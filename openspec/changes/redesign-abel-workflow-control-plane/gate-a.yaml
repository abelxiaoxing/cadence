receipt_version: 1
change: redesign-abel-workflow-control-plane
schema: spec-driven
behavior_contract:
  goal: >-
    将 abel-design 与 abel-implement 从一次性、进程内、Worker 绑定的
    fail-closed 调用链，重构为持久、可恢复、Worker 可替换、审批绑定且以
    change 级隔离验证和事务交付为完成边界的私有工作流控制平面。
  scope:
    - Design 与 Implement 的 stable durable run identity 独立于 delivery revision；revision 作为同一 run 上的版本化 Gate binding
    - start、status、resume、rebind、cancel、discard 是 closed change-oriented 幂等控制；父模型不提交 graph、hash、snapshot 或 apply identity
    - transport、endpoint、environment、capacity、artifact、stale、conflict 与 verification failure 使用 typed recoverable state
    - Worker 与 model 是可替换执行资源；task ledger 独立保存 Red、Green、Refactor 所需可信上下文
    - 完整任务 DAG、affected suite、full suite、outputs 与 AGENTS checkpoint 在私有 change workspace 内完成
    - main workspace 仅接收完成全部验证的 cumulative change，并在 apply 前执行 currentness 检查和可恢复 transaction；首个文件变更后的 cancel/discard 必须先 recovery 再 pause/cleanup
    - boundary gap 暂停为 approval-needed；行为变化重走 Gate A/B，纯技术变化只重走 Gate B
    - Design 在每个 Gate 合并关联问题，机械且可逆的仓库唯一选择不单独阻塞
    - TUI、print、JSON 与 RPC 显示真实 queued、running、retrying、paused、approval-needed、applying 与 completed 语义
    - 私有状态位于仓库外 owner-private location；resolved state path 等于或位于 canonical consumer root 内时直接拒绝；不持久化 credential、environment、raw prompt、hidden reasoning、child transcript 或 raw model output
  compatibility:
    - breaking v2，删除 v1 admit-graph、task-attempt、embedded-graph receipt 与 single-endpoint protocol 的一般兼容义务；本变更仅保留 acceptance-gated、durable-handoff 的一次性 bootstrap
    - 当前仓库没有 active OpenSpec change 或需要迁移的 run
    - Gate authority、scoped Worker access、path/symlink safety、parent-owned acceptance 与 no implicit commit/archive/publish/release 保持不变
  non_goals:
    - 不建设公共 Subagent API、跨 extension service、remote queue、cloud state 或 background autonomous Agent platform
    - 不自动批准 Gate 或把 Gate 变成 tool permission
    - 不重新设计 abel-init 或 abel-diagnose 的产品行为
    - 不放宽 approved path、dependency、verification、output provenance、impact closure 或 AGENTS 边界
  success:
    - process、session、model 或 endpoint 替换后可从最后 durable checkpoint 恢复且不重复有效 Gate，delivery revision 更新不创建新 run
    - endpoint 不可用时 status 仍可本地返回，任务暂停或按显式 route policy rebind 而非永久 blocked
    - Green 或 replacement Worker 获得可信 Red command、classification、artifact 与 isolated snapshot evidence
    - conflict 进入 durable queue 并在资源释放后自动 ready，不靠父模型轮询 deferred
    - Red、partial Green、failed full-suite 或 failed checkpoint 不修改 main workspace
    - stale main workspace 保留用户修改并暂停 rebase；成功完成只在 cumulative apply 与 postconditions 提交后发生
    - blocked、paused、retryable、approval-needed 与 failed verification 从不显示 completed check mark
    - completed 与 discard 会清理 private code/artifact state，paused run 可显式 resume/rebind/discard，apply 中 discard 不会提前删除 rollback material
    - v1 bootstrap activation 保持到全部任务与 acceptance 成功，selector 切换前已有可恢复 v2 handoff，cutover 任一点重载都不会搁浅
approval:
  summary: >-
    用户明确批准 Gate A 的推荐 breaking-v2 契约，并在 review 修订中要求闭合
    stable run identity、公开 rebind、仓库外 state root、apply recovery、bootstrap
    cutover 与 truthful activity 问题；项目仍处于开发阶段，不保留一般 v1 兼容。
  verbatim: |-
    批准 Gate A，按推荐契约设计，允许 breaking v2
    修复上述review产生的问题，注意当前项目处于开发阶段，无需考虑兼容性
