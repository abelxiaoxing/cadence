  conflicts_and_locks:
    - All five tasks are serial because every successor consumes the predecessor contract and overlapping Runtime or package paths prohibit concurrent writes.
    - Runtime core, candidate apply, lifecycle, task admission, and real Agent Loop/package verification each use the exact resource and verification locks recorded above.
    - Gate receipts, OpenSpec tracking, and AGENTS.md are excluded from every Worker write set; S1 through S4 AGENTS targets are parent-owned and participate in task conflict.
  task_preconditions:
    S1: Validate trusted delivery and record fresh target, affected, and full-suite baselines while preserving all existing dirty files.
    S2: Require accepted S1 target, affected suite, managed AGENTS checkpoint, and fresh snapshot.
    S3: Require accepted S2 typed candidate boundary, target, affected suite, managed AGENTS checkpoint, and fresh snapshot.
    S4: Require accepted S3 terminal/drain contract, target, affected suite, managed AGENTS checkpoint, and fresh snapshot.
    S5: Require accepted S4 task-lifetime admission, target, affected suite, managed AGENTS checkpoint, and fresh snapshot.
  verification_policy:
    - Every task performs only its approved Red test diff first and witnesses the stable expected identity.
    - Parent applies complete current candidates mechanically, reruns the exact target after every test or code edit, and runs affected commands after Refactor.
    - Pre-existing failures remain separate from Red; environmental or unattributable failures block without speculative edits.
    - Final acceptance runs check, lint, full test, check:agents, pack:check, historical traceability, strict OpenSpec validation, and git diff --check with no new failure relative to baseline.
