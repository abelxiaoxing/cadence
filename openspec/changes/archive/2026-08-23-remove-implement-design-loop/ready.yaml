receipt_version: 1
change: remove-implement-design-loop
schema: spec-driven
approval:
  summary: >-
    用户在呈现一次 boundary、typed failure、TaskState、task-lifetime conflict、真实 Pi Tool Error 与 package-wide nextStep 删除的完整技术方向、五任务 S1→S5 严格串行 DAG、关键写集、验证和 AGENTS 策略后，明确批准按该合同实施。后续物化把该批准机械展开为 tasks.md 中的 exact phase write sets、88 条 Scenario 唯一归属、空依赖变更与固定验证命令；不授权运行期扩大行为、路径、依赖、架构、验证或 AGENTS 合同。
  verbatim: "批准 Gate B：按上述 S1→S5 串行合同实施 并且后续所有你的推荐我都批准"
implementation_contract:
  revision: A
  architecture:
    - src/contracts.ts owns the strict Implement open-task or phase-attempt union, closed failure/outcome contracts, phase-local exact scope, and package-shared DiffResult without nextStep.
    - src/worker.ts owns one canonical-root/change/task-keyed process-local TaskRecord with pinned provider/model identity, immutable boundary, derived conflict, and closed state; duplicate Contract DTOs and equality comparators are deleted.
    - src/submit-tool.ts and src/child-session.ts preserve closed structural, cancellation, timeout/transport, and result-limit delivery facts; error text is display-only.
    - src/candidate-preflight.ts, src/patch.ts, and src/result-store.ts preserve closed typed candidate identity, isolated complete preflight, exact ordinary Git apply, checkpoint results, currentness, and deterministic cleanup.
    - src/runtime.ts admits before await/child, derives child requests from the boundary, advances only on Runtime preflight plus exact apply, owns bounded state/terminal replay/task-lifetime conflict, and returns direct domain outcomes.
    - src/scheduler.ts exposes only a pure declaration conflict predicate and bounded attempt scheduling; it owns no cross-call TaskRecord, waiter, lease, reservation, or recovery state.
    - src/index.ts returns valid domain outcomes normally and lets protocol/internal exceptions reach the real Pi Agent Loop; synthetic isError is deleted.
    - Prompt, Skill, package Agents, submit schema, TUI, fixtures, distribution, and active OpenSpec deltas remove Implement Design routing, successor claims, and shared nextStep without changing the Diagnose algorithm.
  task_dag:
    - S1 -> S2 [contract, conflict-order]
    - S2 -> S3 [contract, conflict-order]
    - S3 -> S4 [contract, conflict-order]
    - S4 -> S5 [contract, conflict-order]
  suggested_waves:
    - [S1]
    - [S2]
    - [S3]
    - [S4]
    - [S5]
