receipt_version: 1
change: remove-implement-design-loop
schema: spec-driven
behavior_contract:
  goal: 让 Implement 在一次注册的批准边界内自治推进，以真实 typed 状态表达当前任务结果，并删除 Runtime 无权拥有的 Design 路由、后继阻塞声明和 Worker 下一步控制通道。
  scope:
    - 可信交付无效在任务注册前形成 stage blocker，不伪装为 TaskFailure
    - 每个任务一次注册稳定 boundary，后续 phase、candidate decision 与 checkpoint 只提交动态事实
    - Runtime 只以自身 isolated preflight 与 exact apply 事实推进 Red、Green、Refactor 和 AGENTS checkpoint
    - 每个 phase 最多两次非取消 child launch，artifact、stale 与 transport 共享预算；checkpoint 单独最多两次 parent attempt
    - cancellation 不消耗 launch，result-limit 与 environment 或 approval-boundary failure 形成当前任务终态且不接受 partial diff
    - task-lifetime conflict 覆盖所有 phase、candidate pending、checkpoint pending 与非 none AGENTS target；冲突 open 立即 deferred
    - blocked 与 completed 是可幂等 replay、无 child 出边的进程内终态，terminal 或 drain 释放 conflict
    - child、preflight、apply 与 checkpoint failure 保持 closed typed value，未知异常不按字符串猜测分类
    - Implement domain stop 正常返回，protocol 与 internal error throw 并由真实 Pi Agent Loop 标记 Tool Error
    - 包级删除 DiffResult.nextStep，Diagnose 只删除共享字段而不改变复现、回归和修复算法
    - Worker、Runtime 与 Prompt 不选择、推荐或调用下一工作流阶段，也不声称 Parent DAG 后继已阻塞
    - fixed phase boundary 取代运行期 dynamic repair scope；批准边界外需求只阻塞当前任务且不扩边界
  non_goals:
    - 删除 Design 阶段或允许 Implement 决定新行为、策略、依赖、架构、安全、兼容或迁移
    - 放宽 diff、snapshot、path、dependency、verification、AGENTS、impact closure 或 isolated preflight
    - 重写 Design 或 Diagnose run envelope、Diagnose 算法或 Parent DAG 所有权
    - 引入通用状态机、完整 Runtime DAG、lease、waiter、持久恢复平台、无界重试、partial diff 或临时 repair task
    - 扩展 Scheduler 为跨 tool call 的任务生命周期管理器
    - 保留未发布旧协议 alias、双协议、兼容层，或自动 archive、commit、publish、release、调用其他工作流
  success:
    - stable boundary 只能注册一次且 phase-local exact write、identity、provider/model 和 operation binding 全部 fail closed
    - phase 只随 Runtime preflight 与 exact apply 推进，预算、取消、checkpoint、terminal replay 与 drain 行为可执行验证
    - conflict 在 phase gap 与 pending review 持续生效，deferred 不注册或消耗，terminal 与 drain 释放且 independent sibling 保留
    - Implement 合同不含 design-required、return-to-design、dependent-successor claim 或 next-step control metadata
    - blocked 与 cancelled 在真实 Agent Loop 中不是 Tool Error，protocol/internal throw 是真实 Tool Error
    - target 与 affected suite 全绿且 full suite 相对写前基线无新增失败，distribution、pack 与 traceability 通过
approval:
  summary: 用户批准采用 remove-implement-design-loop，并批准候选文档所定义的无 Design 回环、一次 boundary、typed failure、任务终态、task-lifetime conflict、真实 Tool Error、包级删除 nextStep、fixed boundary 和删除未发布旧协议的完整行为契约。
  verbatim: "批准 Gate A，采用 change 名 remove-implement-design-loop,并且后续所有内容我都批准"
