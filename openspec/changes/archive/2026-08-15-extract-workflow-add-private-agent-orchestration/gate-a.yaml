receipt_version: 1
change: extract-workflow-add-private-agent-orchestration
schema: spec-driven
behavior_contract:
  summary: >-
    Extract @abel/pi-abel-workflow into the current root as a standalone single-package repository and relocate the complete dirty reference repository intact before product implementation. Permit the relocated repository only as read-only implementation, attribution, license, and provenance evidence; prohibit every standalone product, dependency, import, test, command, symlink, pack, installation, and runtime resolution through either reference path. Preserve the four workflow commands, four bundled Skills, and configuration paths while adding four immutable package-owned read-only professional Agents and one abel_dispatch tool that is registered but inactive by default. Eligible Design, Implement, and Diagnose stages may activate it and lifecycle cleanup restores it to inactive without disturbing unrelated tools. Workers return compact evidence or metadata with complete unified diffs; the parent exclusively owns Gates, result review, exact patch application, command execution, validation, AGENTS, and task state. Compatible work may run concurrently, but each result binds hashes only for files actually read or proposed for writing, so unrelated sibling application does not make it stale and a related file change does. Provider retry is disabled with maxRetries 0, no private cooldown is implemented, and a failed request receives at most one identical mechanical redispatch. Private runs, queues, retained diffs, and child sessions are in-memory only. Tarball acceptance creates and inspects a real archive, installs or unpacks it to an isolated directory, and loads that directory rather than treating the .tgz file as a local Pi package. The package performs no Pi host-version validation or support classification. The MVP uses one bounded seed wave and excludes a general Subagent platform, custom transaction or rollback platform, multi-level budget platform, compatibility platform, permission system, UI, isolation platform, persistence, publication, remote repository, and automatic release system.
approval:
  summary: >-
    The user explicitly approved Gate A with the recommended B-03 retry strategy and stated that subsequent recommended strategies are approved. B-03 means Provider maxRetries is 0, there is no private cooldown or hidden retry, and a failed request may receive at most one mechanical redispatch only when request, role, scope, prerequisites, conflict contract, and write set remain identical apart from refreshed file-snapshot hashes. The approved Gate A contract also selects file-level snapshots over a global workspace revision, registered-but-inactive-by-default dispatch over a hidden tool, installed-or-unpacked tarball-directory loading over direct .tgz loading, evidence-only access to the relocated reference repository, no Pi version validation or compatibility claims, one finite seed bootstrap exception, and a substantially reduced MVP without transaction, budget, or compatibility platforms.
