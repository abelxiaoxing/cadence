approval:
  summary: >-
    In this Design recovery context, after the complete no-placeholder Gate B R-09.1 successor contract was presented with the exact unified direct-SDK adapter v2 source embedded at design.md R-09.1 (lines 891-1333), its verified SHA-256
    7809f7907beefe45e7aab1d34ca2a53f4be022f64e98190cab6c78eaeb54b7b4, the verified capability result (exit 0, environmentReady true, zero real Provider requests, unchanged four-case matrix), P-004-SDA permanent retirement, P-004-SDA2 successor identity and token, architecture v2 identity separation, per-attempt ABEL_WORKER_ATTEMPT_FAILED diagnostics, explicit terminal protocol, precise redispatch classes, packet and token contracts, TDD and result bounds, DAG and traceability, persistence boundary, parent authority, Gate A audit, the resolved environment state, and the two rejected alternatives, the user explicitly approved it with the word "批准". This receipt binds only that fully presented R-09.1 contract and authorizes no unpresented behavior, architecture, dependency, persistence, retry, permission, compatibility, bootstrap, identity, scope, or tool-authorization decision.
delivery:
  gate_a_audit_summary: >-
    Gate A remains unchanged. R-09.1 changes only private implementation-delivery tooling and technical task identity. Worker success still requires a structural abel_submit_result; the immutable package role and read-only tool boundary remain; the parent alone reviews, ordinary-checks, applies, verifies, maintains AGENTS, and advances task state. R-09.1 changes no Requirement, Scenario, product Runtime or ExtensionContext semantics, activation rule, public action, dependency, permission, persistence, Provider retry policy, compatibility policy, publication policy, or seed/bootstrap exception. proposal.md, both delta specs, and gate-a.yaml retain their validated Gate A bytes and hashes.
  r09_historical_summary: >-
    R-09 v1 and P-004-SDA are the historical record. SDA's Red dispatch ran after the exact fixed tuple became available and the complete v1 capability command exited 0: one Bun process, one stdin read, one validated version-2 packet frozen before attempts, exactly two ABEL_WORKER_REQUEST_ADMITTED markers (attempts 1 and 2) with two post-admission Provider requests; both attempts ended without a trusted structural result, unified diff, or submit-bearing message and were classified admitted-request-failure; Red was not established; the workspace received zero changes; and the checkbox remained pending. No transcript, event packet, raw output, or retained candidate exists, so no deeper child cause is claimed. The v1 inline source retains its exact SHA-256 31d07592dc94e08e6d875deaad9db733f0630915c30bc2ac6646be6346e65c32 as immutable history.
  sda_retirement_summary: >-
    P-004-SDA is permanently retired historical blocked evidence. It owns no checkbox, Scenario ownership, token, continuation, reset, transfer, borrow, renamed-equivalent packet, recovery process, or third request. R-09 v1 is superseded by R-09.1 for every later phase and is not a future runner that can be copied to revive SDA.
  sda2_identity_summary: >-
    P-004-SDA2 is a substantively new successor identity under R-09.1, not a reset, rename, or revival of SDA or any earlier retired identity. It directly creates SDK sessions, uses a runner-local explicit TypeBox abel_submit_result and runner-local final classification, and never calls product Runtime.execute, runChildSession, createSubmitTool, activation, or an extension action. It uniquely owns Compact structured delivery / Result schema is invalid, directly requires P-004-A, is the direct prerequisite of P-004-FC, uses resource strict-diff-result-contract and verification lock p004-sda2-target, and owns one independent non-transferable Red/Green-shared token.
  fixed_identity_and_environment_summary: >-
    Delivery remains fixed to provider abel, model deepseek-v4-flash, API openai-completions, and thinking off, selected only by Gate B. pi auth check proves API-key-ready Provider auth. The R-09 exit-78 fixed-model-catalog block is resolved historical state: at R-09.1 Design time the complete v2 capability command exits 0 with status=ready, adapterReady=true, environmentReady=true, and zero real Provider requests, so the environment admits the fixed tuple. No fallback identity, SDA/DCR revival, or environment-as-Red classification is allowed.
  adapter_source_summary: >-
    design.md R-09.1 embeds one complete inline v2 source used in capability or run mode. Its exact UTF-8 SHA-256 is 7809f7907beefe45e7aab1d34ca2a53f4be022f64e98190cab6c78eaeb54b7b4 and it calls Bun.stdin.text exactly once in run mode. It imports Pi public SDK APIs plus package-owned role, empty-resource, scoped-read, and snapshot modules, and imports none of the product Runtime, child-session, submit-tool, result-store, or extension entry modules. Architecture is direct-sdk-delivery-adapter-v2; ALLOWED_TASKS contains P-004-SDA2 and later identities; RETIRED_TASKS contains P-004-DCR and P-004-SDA. No repository or /tmp runner script is created; the v1 source remains embedded byte-identical as history.
  capability_summary: >-
    Capability mode uses four fresh faux-only in-memory sessions and zero real Provider requests. It proves the strict additionalProperties-false schema reaches Provider context; valid has one attempt, one execute, one accepted trusted single-submit result; malformed has one attempt and zero executes; wrong identity has one attempt and one rejected execute; multiple has two attempts and two executes but is untrusted. Every case delegates exactly one faux Provider request. Verified at R-09.1 Design time: exit 0, status=ready, adapterReady=true, environmentReady=true, roleSha256 9859c57a90f707abe6705d820a1269781c79b5eaeb3efcf07570124e9505ba1f, providerSawStrictSchema=true, oneProviderRequestPerSession=true, realProviderRequests=0.
  phase_packet_and_canonical_summary: >-
    Run mode accepts one base64-encoded complete version-2 direct-sdk-delivery-adapter-v2 packet. The parent constructs it only from valid R-09.1 artifacts, the exact task contract, accepted prerequisite evidence, current workspace snapshot, and current Implement-context token evidence. The runner reads stdin once, validates exact shape/path/symlink/snapshot/identity/bounds, clones and recursively freezes the packet, and deterministically serializes architecture, task, role hash, objective, bounded context, declarations, snapshot path keys, prerequisites, fixed identity, result bounds, and token declaration (canonical core identical in shape to R-09 v1). Attempt 2 is derived only from that frozen packet in the same process; only snapshot values and fresh auth vary. No second packet, objective, parent baseline hash, stdin reread, or third attempt exists.
  provider_and_marker_summary: >-
    Every SDK session may delegate at most one real Provider request. The runner-local Provider wrapper synchronously emits exactly one ABEL_WORKER_REQUEST_ADMITTED stderr marker immediately before its first delegation. Any Pi-agent follow-up turn receives a local in-memory error stream and cannot reach the Provider. A marker binds task, phase, explicit attempt, provider, model, API, and thinking and contains no credential, token, session id, timestamp, result id, or hash. Every failed attempt additionally emits exactly one ABEL_WORKER_ATTEMPT_FAILED stderr marker with only class (pre-admission-failure | runner-error | provider-error | timeout | ended-without-submit | structural-result-rejection), submitAttempts, submitExecutes, and finalCategory, and no transcript, raw content, credential, token, session id, timestamp, result id, or hash. Zero, duplicate, mismatched, or out-of-order markers block; a failed attempt without exactly one matching ATTEMPT_FAILED marker, or an ATTEMPT_FAILED post-marker class without its ADMITTED marker, blocks without further dispatch.
  structural_classification_summary: >-
    The runner-local submit schema has exact id, role, kind, taskId, phase, summary, diff, expectedVerification, risks, nextStep, and contractCompliant fields with no additional properties. Submit attempts count at tool-execution start, including malformed calls; execute entry is counted separately. The first submit-bearing Assistant message is classified before message erasure. Success requires exactly one attempt, one execute, one accepted value, single-submit-only shape, exact request/role/task/phase, valid schema, and valid bounds. Malformed, wrong-identity, mixed, multiple, or out-of-bounds submit-bearing output is structural rejection and cannot use the token for another request.
  failure_and_token_summary: >-
    Capability, packet, path, symlink, snapshot, canonical, role/hash, auth, or session/tool construction failure is pre-admission (ATTEMPT_FAILED pre-admission-failure, no ADMITTED), consumes no request or token, and may be repaired before a fresh initial runner starts. An attempt-1 provider-error, timeout, or ended-without-submit failure consumes one request and may consume the task token only for same-process frozen-packet attempt 2. Structural-result-rejection and post-marker runner-error block immediately with no redispatch. Attempt-2 pre-marker failure leaves the token consumed and blocks; an attempt-2 marker consumes the second request and every later failure blocks. Parent schema/path/hash/line/snapshot/semantic/ordinary-Git/wrong-reason rejection cannot be compensated. Accepted attempt 1 preserves the token for a later phase; accepted attempt 2 consumes it. Tokens never reset, transfer, borrow, revive history, authorize a request independently, or persist as a ledger.
  persistence_and_parent_summary: >-
    Adapter, Worker, and parent persist no credential, packet, canonical request/hash, marker/token ledger, transcript, raw model output, tool history, result file, session/settings, timestamp, queue, checkpoint, or runtime state. Allowed state is current-process lexical objects, in-memory runtime/session/settings, one bounded accepted structural value, current command output, and Pi host-owned parent transcript. Worker has exactly abel_submit_result, find, grep, ls, and read. Parent recomputes exact UTF-8 bytes, SHA-256, metadata, parsed paths, line counts, identities, bounds, and snapshots; uses ordinary git apply --check --whitespace=nowarn on exact bytes; and applies only identical bytes. It never repairs, formats, reconstructs, splices, partially applies, or uses --recount or --unidiff-zero to admit delivery.
  task_dag_summary: >-
    The 13 executable identities are P-001, P-002, P-003, P-004-A, P-004-SDA2, P-004-FC, P-004-HDR, P-004-B2, P-004-C, P-005, P-006, P-007, and P-008. Four are complete and nine pending. The direct chain is P-001 -> P-002 -> P-003 -> P-004-A -> P-004-SDA2 -> P-004-FC -> P-004-HDR -> P-004-B2 -> P-004-C -> P-005 -> P-006 -> P-007 -> P-008, with P-008 directly requiring all twelve predecessors. P-004-SDA2 is the unique algorithmic ready task with zero admitted requests and its own unused non-transferred token; the environment block is resolved and the complete v2 capability command exits 0. SDA and all earlier retired P-004 identities are not DAG nodes.
