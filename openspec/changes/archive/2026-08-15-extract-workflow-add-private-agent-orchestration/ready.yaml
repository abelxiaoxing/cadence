revisions:
  - id: R-09.2
    context: Implement-context user approval (after repeated blocked delivery attempts)
    change: >-
      The R-09.1 v2 adapter source is revised in design.md: readTools now normalizes
      root-contained absolute and ./-prefixed model-supplied paths to canonical
      repository-relative paths before covers() scope checks and scoped execution.
      Root cause of every prior ended-without-submit failure: deepseek-v4-flash
      occasionally calls read/grep/find/ls with absolute paths, covers() and
      resolveScoped both rejected them, the tool errored, session.abort() ran, and
      the phase ended without submission. Product scoped-tools.ts is unchanged.
      New source SHA-256 is dd3694519954c8a7f680f99e1c4c5b3d50798218aea3ec478b0b4beb917a7e2b;
      the pre-revision source 7809f7907beefe45e7aab1d34ca2a53f4be022f64e98190cab6c78eaeb54b7b4
      and v1 remain immutable history. Prior Red/Green exhaustion records for
      P-004-SDA2 are superseded: fresh Red and Green dispatches under the R-09.2
      revision are authorized. No Requirement, Scenario, product behavior, product
      module, permission, persistence, or publication contract changes.
  - id: R-09.3
    context: Implement-context user approval (R-09.2 revision still failed twice)
    change: >-
      readTools now distinguishes content tools (read, grep: strictly declared
      read set) from metadata tools (ls, find: additionally admit root "." and
      parent directories of declared paths); the observer records directory
      manifests without erroring and still rejects undeclared file observations.
      Root cause of remaining ended-without-submit failures: the model's natural
      "ls ." exploration was rejected because "." is not a declared read path,
      pushing the model into explanation-only output. Read scope escape Scenario
      stays satisfied: read/grep never return out-of-declared-set content, ls/find
      return only name/type metadata, observed directories are snapshot-verified.
      New source SHA-256 is
      da8afda9c345c44306e18765b7ad95eeaacc44f77ce05ae4031e1ac4418dda26; earlier
      revisions dd3694519954c8a7f680f99e1c4c5b3d50798218aea3ec478b0b4beb917a7e2b
      and 7809f7907beefe45e7aab1d34ca2a53f4be022f64e98190cab6c78eaeb54b7b4 and v1
